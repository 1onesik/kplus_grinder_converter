      },

      },
      ek43_16: {

    const ROAST_FACTORS = {

      },
      medium: {

      },

    const BREW_METHODS = {
      v60_multi: {
        label: 'V60 다중 푸어 (3~5회 분할 주입)',

      },
      v60_single: {
        label: 'V60 원푸어 / 2회 푸어 (저교반)',
        agitationFactor: 1.0,
        desc: '물줄기에 의한 미분 침강이 적어 비교적 원래 입도(D50)에 가깝게 추출됩니다.'
      },
      flat_bottom: {
        label: '플랫 바텀 (Kalita Wave / Orea)',
        agitationFactor: 1.15,
        desc: '베드 깊이가 얕고 유속이 일정하지만 하단 배수구 저항의 영향을 받습니다.'
      },
      immersion: {
        label: '침출식 / 에어로프레스 (Clever / Cupping)',
        agitationFactor: 0.3,
        desc: '중력 여과 저항(Darcy’s Law)의 영향을 거의 받지 않으므로 순수 표면적(D50) 일치가 가장 중요합니다.'
      },
      espresso: {
        label: '에스프레소 / 터보샷 (9bar / 6bar)',
        agitationFactor: 1.5,
        desc: '고압 추출에서는 주 입도보다 미분 비율(<100µm)이 퍽의 수리학적 저항을 지배합니다.'
      }
    };

    const COMPENSATION_MODES = {
      flow: {
        id: 'flow',
        title: '유속 및 추출시간 동기화 (권장)',
        badge: '실전 레시피 최적',
        desc: '버 형상 차이로 발생하는 미분량과 커피 베드 투수율을 계산하여 원 레시피와 동일한 드로우다운(추출 시간) 및 수율을 구현합니다.'
      },
      clarity: {
        id: 'clarity',
        title: '클린컵 & 향미 밸런스 매칭',
        badge: '클린컵 중심',
        desc: '48mm K-Plus 특유의 높은 바디감과 미분 과다 추출을 억제하기 위해 분쇄도를 미세하게 풀고 온도와 교반 보정치를 함께 제시합니다.'
      },
      d50: {
        id: 'd50',
        title: '순수 입도 피크(D50) 1:1 매칭',
        badge: '물리적 피크 일치',
        desc: '유속 저항을 무시하고 레이저 회절 입도 분석기 기준 주 입도 피크(µm)만을 수학적으로 일치시킵니다.'
      }
    };

    function App() {
      const [sourceGrinder, setSourceGrinder] = useState('c40_std');
      const [sourceSetting, setSourceSetting] = useState(24);
      const [roastLevel, setRoastLevel] = useState('light');
      const [brewMethod, setBrewMethod] = useState('v60_multi');
      const [compMode, setCompMode] = useState('flow');
      const [activePreset, setActivePreset] = useState(null);

      // 그라인더 변경 시 기본값 자동 스케일링
      const handleGrinderChange = (newGrinder) => {
        setActivePreset(null);
        const currentSpec = GRINDER_SPECS[sourceGrinder];
        const currentD50 = currentSpec.d50Intercept + sourceSetting * currentSpec.d50Slope;

        const nextSpec = GRINDER_SPECS[newGrinder];
        let estimatedSetting = (currentD50 - nextSpec.d50Intercept) / nextSpec.d50Slope;
        estimatedSetting = Math.max(nextSpec.min, Math.min(nextSpec.max, estimatedSetting));

        if (nextSpec.step === 1) {
          setSourceSetting(Math.round(estimatedSetting));
        } else {
          setSourceSetting(Number(estimatedSetting.toFixed(1)));
        }
        setSourceGrinder(newGrinder);
      };

      // 프리셋 적용 함수
      const applyPreset = (preset) => {
        setActivePreset(preset.id);
        setSourceGrinder(preset.grinder);
        setSourceSetting(preset.setting);
        setRoastLevel(preset.roast);
        setBrewMethod(preset.brewMethod);
        setCompMode(preset.mode);
      };

      // --- 핵심 정량 물리 엔진 계산 ---
      const analysis = useMemo(() => {
        const src = GRINDER_SPECS[sourceGrinder];
        const kplus = GRINDER_SPECS.k_plus;
        const roast = ROAST_FACTORS[roastLevel];
        const brew = BREW_METHODS[brewMethod];

        // 1. 소스 그라인더의 정량적 치수 계산 (µm)
        const srcVerticalUm = Math.round(sourceSetting * src.stepVerticalUm);
        const srcBurrGapUm = Math.round(srcVerticalUm * src.gapRatio);
        const srcD50Um = Math.round(src.d50Intercept + sourceSetting * src.d50Slope);

        // 2. 소스 그라인더의 미분(<100µm) 비율 추정 (%)
        const finenessIndex = Math.max(0.4, 1100 / Math.max(250, srcD50Um));
        const srcFinesPct = Math.min(
          38,
          Math.max(4.5, 9.2 * Math.pow(finenessIndex, 0.72) * src.baseFinesFactor * roast.finesMultiplier)
        );

        // 3. 순수 D50 일치 기준 K-Plus 클릭수 계산
        const rawKPlusClicksExact = (srcD50Um - kplus.d50Intercept) / kplus.d50Slope;
        const rawKPlusClicks = Math.max(15, Math.min(130, Math.round(rawKPlusClicksExact)));

        // 보정 전 K-Plus 미분 비율
        const kPlusUncompFinesPct = Math.min(
          42,
          Math.max(5.0, 9.2 * Math.pow(finenessIndex, 0.75) * kplus.baseFinesFactor * roast.finesMultiplier)
        );

        // 4. 버 형상 & 미분 차이에 따른 수리학적 유속 보정량 계산
        const finesDiff = kPlusUncompFinesPct - srcFinesPct;
        const distributionWidthDiff = kplus.baseSigma - src.baseSigma;

        let clickCompensation = 0;
        if (compMode === 'd50') {
          clickCompensation = 0;
        } else if (compMode === 'flow') {
          const baseHydroShift = (finesDiff * 1.15) + (distributionWidthDiff * 18);
          clickCompensation = baseHydroShift * brew.agitationFactor * roast.flowPenalty;
        } else if (compMode === 'clarity') {
          const baseClarityShift = (finesDiff * 1.35) + (distributionWidthDiff * 24);
          clickCompensation = baseClarityShift * Math.max(0.8, brew.agitationFactor) * roast.flowPenalty;
        }

        const compensatedClicksExact = rawKPlusClicksExact + clickCompensation;
        const recommendedClicks = Math.max(15, Math.min(135, Math.round(compensatedClicksExact)));
        const clickDelta = recommendedClicks - rawKPlusClicks;

        // 5. 추천 세팅 기준 정량 스펙
        const kPlusVerticalUm = recommendedClicks * kplus.stepVerticalUm;
        const kPlusBurrGapUm = Math.round(kPlusVerticalUm * kplus.gapRatio);
        const kPlusTargetD50Um = Math.round(kplus.d50Intercept + recommendedClicks * kplus.d50Slope);

        const compFinenessIndex = Math.max(0.35, 1100 / Math.max(250, kPlusTargetD50Um));
        const kPlusCompFinesPct = Math.min(
          42,
          Math.max(4.8, 9.2 * Math.pow(compFinenessIndex, 0.75) * kplus.baseFinesFactor * roast.finesMultiplier)
        );

        // 6. 유체역학적 유효 입경
        const srcEffectiveHydroUm = Math.round(srcD50Um / (1 + (srcFinesPct / 100) * 3.4));
        const kPlusUncompHydroUm = Math.round(srcD50Um / (1 + (kPlusUncompFinesPct / 100) * 3.4));
        const kPlusCompHydroUm = Math.round(kPlusTargetD50Um / (1 + (kPlusCompFinesPct / 100) * 3.4));

        // 7. 다이얼 표기
        const rotations = Math.floor(recommendedClicks / 90);
        const remAfterRot = recommendedClicks % 90;
        const dialNumber = Math.floor(remAfterRot / 10);
        const subClick = remAfterRot % 10;
        const dialString = `${rotations}회전 - 숫자 ${dialNumber} - ${subClick}클릭`;
        const shortDialCode = `${rotations}-${dialNumber}-${subClick}`;

        // 8. 가이드 생성
        let tempDelta = 0;
        let pourAdvice = '';
        let drawdownPrediction = '';

        if (sourceGrinder.startsWith('ek43')) {
          tempDelta = compMode === 'd50' ? -3 : -1.5;
          pourAdvice = 'EK43 레시피의 강한 교반(Rao Spin, 강한 스월링)을 K-Plus에서 그대로 따라 하면 미분이 필터 하단에 침착되어 후반부 유속이 급격히 막힙니다. 스월링은 마지막 푸어 직후 가볍게 1~2회만 수행하세요.';
          drawdownPrediction = clickDelta > 0
            ? `보정 미적용 시 원 레시피보다 약 +25~40초 지연됨 → +${clickDelta}클릭 보정으로 추출 시간 동기화 완료`
            : '주의: 순수 D50 매칭 사용 시 EK43 대비 추출 시간이 30초 이상 길어지고 과다추출(떫은맛) 위험이 높습니다.';
        } else {
          tempDelta = compMode === 'd50' ? -1 : -0.5;
          pourAdvice = '48mm K-Plus 버는 39mm 코만단테보다 분쇄 속도가 약 2배 빠르며 원두가 버에 머무는 시간이 짧지만, 순간 파쇄 토크가 높아 미분이 약 1.2~1.8%p 더 생성됩니다. 중심부 위주의 부드러운 수직 푸어를 권장합니다.';
          drawdownPrediction = clickDelta > 0
            ? `보정 미적용 시 C40 대비 약 +10~18초 지연 → +${clickDelta}클릭 보정으로 동일한 유속 확보`
            : 'C40와 유사한 추출 흐름을 보이나 후반부 드립 베드가 약간 더 조밀해집니다.';
        }

        return {
          src,
          kplus,
          srcVerticalUm,
          srcBurrGapUm,
          srcD50Um,
          srcFinesPct: Number(srcFinesPct.toFixed(1)),
          rawKPlusClicks,
          recommendedClicks,
          clickDelta,
          kPlusVerticalUm,
          kPlusBurrGapUm,
          kPlusTargetD50Um,
          kPlusUncompFinesPct: Number(kPlusUncompFinesPct.toFixed(1)),
          kPlusCompFinesPct: Number(kPlusCompFinesPct.toFixed(1)),
          srcEffectiveHydroUm,
          kPlusUncompHydroUm,
          kPlusCompHydroUm,
          rotations,
          dialNumber,
          subClick,
          dialString,
          shortDialCode,
          tempDelta,
          pourAdvice,
          drawdownPrediction
        };
      }, [sourceGrinder, sourceSetting, roastLevel, brewMethod, compMode]);

      // 입도 분포 곡선 계산
      const psdChartData = useMemo(() => {
        const points = [];
        const numSteps = 90;
        const minUm = 30;
        const maxUm = 1550;

        const { src, kplus, srcD50Um, kPlusTargetD50Um, srcFinesPct, kPlusUncompFinesPct, kPlusCompFinesPct } = analysis;

        const calcBimodalHeight = (x, d50, sigma, finesPct) => {
          if (x <= 0) return 0;
          const finesPeakCenter = 80;
          const finesSigma = 0.55;
          const finesAmp = (finesPct / 15) * 0.28;
          const finesVal = finesAmp * Math.exp(-Math.pow(Math.log(x / finesPeakCenter), 2) / (2 * Math.pow(finesSigma, 2)));

          const mainAmp = (0.34 / sigma) * 0.85;
          const mainVal = mainAmp * Math.exp(-Math.pow(Math.log(x / d50), 2) / (2 * Math.pow(sigma, 2)));

          return (finesVal + mainVal) * 100;
        };

        for (let i = 0; i <= numSteps; i++) {
          const um = minUm + (i / numSteps) * (maxUm - minUm);
          const srcY = calcBimodalHeight(um, srcD50Um, src.baseSigma, srcFinesPct);
          const kUncompY = calcBimodalHeight(um, srcD50Um, kplus.baseSigma, kPlusUncompFinesPct);
          const kCompY = calcBimodalHeight(um, kPlusTargetD50Um, kplus.baseSigma, kPlusCompFinesPct);

          points.push({ um: Math.round(um), srcY, kUncompY, kCompY });
        }

        return points;
      }, [analysis]);

      const buildSvgPath = (data, key, width, height) => {
        const maxUm = 1550;
        const minUm = 30;
        const maxY = 145;

        return data
          .map((pt, idx) => {
            const x = ((pt.um - minUm) / (maxUm - minUm)) * width;
            const y = height - Math.min(height - 8, (pt[key] / maxY) * (height - 20));
            return `${idx === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`;

                  <h3 className="text-base font-semibold">원본 레시피 완벽 재현을 위한 브루잉 보정 프로토콜</h3>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="border border-neutral-300 rounded p-4 space-y-2">
                      <div className="flex items-center justify-between gap-2 text-sm font-semibold">
                        <span>권장 추출 수온 보정</span>
                        <span className="font-mono">
                          {analysis.tempDelta === 0 ? '동일 유지' : `${analysis.tempDelta}°C`}
                        </span>
                      </div>
                      <p className="text-sm text-neutral-600 leading-relaxed">
                        {sourceGrinder.startsWith('ek43')
                          ? 'EK43 레시피(보통 94~98°C)를 K-Plus에 그대로 적용하면 미분에서 잡미가 과다 추출됩니다. 원본 레시피보다 수온을 1.5~2°C 낮추어 추출하세요.'
                          : '코만단테 레시피와 거의 동일한 수온을 사용하되, 중후반부 쓴맛이 감지되면 수온을 0.5~1°C 낮추면 단맛 밸런스가 살아납니다.'}
                      </p>
                    </div>

                    <div className="border border-neutral-300 rounded p-4 space-y-2">
                      <div className="flex items-center justify-between gap-2 text-sm font-semibold">
                        <span>푸어 유량 & 스월링(교반)</span>
                        <span className="text-xs font-normal text-neutral-600 border border-neutral-300 rounded px-1.5 py-0.5">
                          저교반 권장
                        </span>
                      </div>
                      <p className="text-sm text-neutral-600 leading-relaxed">{analysis.pourAdvice}</p>
                    </div>

                    <div className="border border-neutral-300 rounded p-4 space-y-2">
                      <div className="flex items-center justify-between gap-2 text-sm font-semibold">
                        <span>K-Plus 분쇄 테크닉 (팁)</span>
                      </div>
                      <p className="text-sm text-neutral-600 leading-relaxed">
                        EK43이나 C40 수준의 극도로 깔끔한 클린컵을 원할 경우, K-Plus를 <strong>약 30~45도 기울여서 분쇄</strong>하면 원두 투입량이 줄어들어 미분이 최대 15% 감소합니다. (이 경우 보정 클릭에서 -2클릭 얄팍하게 조이세요.)
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
